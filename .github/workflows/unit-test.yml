name: unit-test

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparation gate
        run: |
          test -f SPEC.md
          test -f PLAN.md
          test -f SPEC_PROCESS.md
          test -f AGENT_LOG.md
          test -f README.md
          test -f SECURITY.md
          ! test -f .env

